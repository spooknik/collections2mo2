[project]
name = "collections2wabbajack"
version = "0.0.1"
description = "Convert Nexus Mods collections into Mod Organizer 2 instances and Wabbajack modlists"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "py7zr>=0.22",
]

[project.scripts]
c2wj = "collections2wabbajack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collections2wabbajack"]

[tool.ruff]
line-length = 100
