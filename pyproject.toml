[project]
name = "collections2wabbajack"
version = "0.0.1"
description = "Convert Nexus Mods collections into Mod Organizer 2 instances and Wabbajack modlists"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "py7zr>=0.22",
    "pyside6>=6.11.2",
    "keyring>=25.7.0",
]

[project.scripts]
c2wj = "collections2wabbajack.cli:main"
c2wj-gui = "collections2wabbajack.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collections2wabbajack"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: requires a local tool (e.g. tools/7za.exe) that may not be present in CI",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
